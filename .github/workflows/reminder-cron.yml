name: Reminder Cron

on:
  schedule:
    # Every 5 minutes — Vercel Hobby crons only run once a day, so GitHub
    # Actions acts as the real reminder ticker.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured on the repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -o /dev/null -w "reminder cron dispatch: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://app.schedly.shop/api/cron/reminders"